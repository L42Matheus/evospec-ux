name: EvoSpec-UX

on:
  push:
  pull_request:

jobs:
  governanca-e-verificacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Regras de governança (R1–R6)
        run: python evospec.py validate

      - name: Autotestes de governança
        run: python tests/test_governance.py

      - name: Verificação independente (falha se houver regressão)
        run: python evospec.py verify --label ci-${{ github.run_number }} --set-baseline

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-evospec
          path: results/
